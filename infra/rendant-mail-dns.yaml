AWSTemplateFormatVersion: '2010-09-09'
Description: Inbound mail routing and SES sender verification for rendant.app.

Parameters:
  HostedZoneId:
    Type: String
    Description: Existing public Route53 hosted zone ID for rendant.app, without the /hostedzone/ prefix.
    AllowedPattern: '^Z[A-Z0-9]+$'
    ConstraintDescription: Supply the existing rendant.app public hosted zone ID.

Resources:
  SesDkimFirstRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId:
        Ref: HostedZoneId
      Name: 4xrzqfw756icr4skcpv472odvleedbii._domainkey.rendant.app.
      Type: CNAME
      TTL: '300'
      ResourceRecords:
        - 4xrzqfw756icr4skcpv472odvleedbii.dkim.amazonses.com.

  SesDkimSecondRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId:
        Ref: HostedZoneId
      Name: o3qysurk4vuo5dpppaxsjqyfhm5nais7._domainkey.rendant.app.
      Type: CNAME
      TTL: '300'
      ResourceRecords:
        - o3qysurk4vuo5dpppaxsjqyfhm5nais7.dkim.amazonses.com.

  SesDkimThirdRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId:
        Ref: HostedZoneId
      Name: rfym6mdpmqeqochqmtqndkokddqvhq6j._domainkey.rendant.app.
      Type: CNAME
      TTL: '300'
      ResourceRecords:
        - rfym6mdpmqeqochqmtqndkokddqvhq6j.dkim.amazonses.com.

  InboundMailRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId:
        Ref: HostedZoneId
      Name: rendant.app.
      Type: MX
      TTL: '300'
      ResourceRecords:
        - 10 mail.pdcd.net.

  SenderPolicyRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId:
        Ref: HostedZoneId
      Name: rendant.app.
      Type: TXT
      TTL: '300'
      ResourceRecords:
        - '"v=spf1 mx include:amazonses.com -all"'

  DmarcPolicyRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId:
        Ref: HostedZoneId
      Name: _dmarc.rendant.app.
      Type: TXT
      TTL: '300'
      ResourceRecords:
        - '"v=DMARC1; p=quarantine; adkim=r; aspf=r"'
